   <div data-include="header.html"></div>

    <form name="smartphone" class="smartphone" method="GET">
        <div class="row-layout">
            <span class="drop-down">
              
            </span>

        <table class="rate" border="8" cellpadding="4" cellspacing="5">
        <thead>
        <tr>
            <th>PARAMETERS:</th>
            <th>RATING:</th>
            <th>ADDITIONAL COMMENTS:</th>

        <div class="row-layout">
            <span class="drop-down">   
        <label for="ratephone">Select the phone<br>you wish to rate</label><br>
        <select name="ratephone" id="ratephone">
            <option value="samsung">Samsung</option>
            <option value="apple">Apple</option>
            <option value="google">Google</option>
            <option value="motorola">Motorola</option>
            <option value="kyocera">Kyocera</option>
            <option value="tlc">TLC</option>
            <option value="hmd">HMD</option>

            <option value="oneplus">OnePlus</option>
            <option value="raz">Raz</option>
            <option value="schok">Schok</option>
        </select>
            <br><br>

        <tr>
            <td>
                <label for="battery-life">Battery Life &amp; Charging</label>
            </td>
            <td>
        <div class="star-rating">
            <input type="radio" name="battery-life" id="battery-5" value="5" />
            <label for="battery-5">★</label>
            <input type="radio" name="battery-life" id="battery-4" value="4" />
            <label for="battery-4">★</label>
            <input type="radio" name="battery-life" id="battery-3" value="3" />
            <label for="battery-3">★</label>
            <input type="radio" name="battery-life" id="battery-2" value="2" />
            <label for="battery-2">★</label>
            <input type="radio" name="battery-life" id="battery-1" value="1" />
            <label for="battery-1">★</label>
        </div>
            </td>
            <td>
       <div class="suggest-wrap" data-category="battery" data-label="battery life and charging">
           <input type="text" placeholder="Write a comment..." autocomplete="off">
           <ul class="suggestions" hidden></ul>
           <p class="comment-message"></p>
       </div>
            </td>
        </tr>
